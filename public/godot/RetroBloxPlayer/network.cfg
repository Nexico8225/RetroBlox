; RetroBlox Player configuration.
; Everything multiplayer now runs through the WEBSITE — no ports to forward,
; no LAN discovery. This file only picks WHICH website to play on.

[platform]
; The RetroBlox website the player signs in to (accounts, avatars, games,
; chat, multiplayer sync). Self-hosting? Point this at your own URL — the
; login card's Server field, RETROBLOX_API or --api= can also override it.
api_url="https://retro-blox.vercel.app"
